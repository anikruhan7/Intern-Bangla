<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .stage { width: 1200px; height: 1200px; position: relative; display: flex; align-items: center; justify-content: center; }

  .bg {
    position: absolute; inset: 0; border-radius: 50%;
    overflow: hidden;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }

  .b1 { width: 620px; height: 620px; left: -80px;  top: -60px;  background: #0b1f4d; }   /* dark blue */
  .b2 { width: 520px; height: 520px; right: -60px; top: -80px;  background: #38bdf8; }   /* light blue */
  .b3 { width: 560px; height: 560px; left: -40px;  bottom: -80px; background: #dc2626; } /* red */
  .b4 { width: 560px; height: 560px; right: -60px; bottom: -60px; background: #15803d; } /* green */
  .b5 { width: 420px; height: 420px; left: 340px;  top: -40px;  background: #f97316; }   /* orange */
  .b6 { width: 420px; height: 420px; right: 260px; bottom: -20px; background: #ec4899; } /* pink */
  .b7 { width: 380px; height: 380px; left: 60px;   top: 380px;  background: #7b3f1d; }   /* chocolate/brown */
  .b8 { width: 300px; height: 300px; left: 450px;  top: 450px;  background: #2563eb; }   /* blue */
  .vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.35) 100%); }

  /* Colorful ring: a solid conic-gradient disc sitting behind the glass
     panel - the glass panel (slightly smaller, centered) covers its middle,
     leaving only a clean multi-color rim visible. No masking needed. */
  .ringfill {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 800px; height: 800px; border-radius: 50%;
    background: conic-gradient(from 0deg,
      #0b1f4d 0deg, #2563eb 45deg, #38bdf8 90deg, #15803d 135deg,
      #f97316 180deg, #dc2626 225deg, #ec4899 270deg, #7b3f1d 315deg, #0b1f4d 360deg);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .glass {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 742px; height: 742px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.55);
    box-shadow:
      inset 0 8px 24px rgba(255,255,255,0.45),
      inset 0 -18px 36px rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  .shine {
    position: absolute; top: -20%; left: -30%; width: 55%; height: 160%;
    background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.65) 45%, transparent 90%);
    transform: rotate(-18deg);
  }

  .mono {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    font-size: 300px;
    letter-spacing: -8px;
    display: flex;
    color: #ffffff;
    text-shadow: 0 6px 18px rgba(0,0,0,0.35), 0 0 40px rgba(255,255,255,0.25);
  }
  .mono .i { color: #ffffff; }
  .mono .b {
    background: linear-gradient(160deg, #fde68a 0%, #f97316 55%, #dc2626 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .cap {
    position: absolute; top: 66px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35));
  }
</style>
</head>
<body>
<div class="stage">
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="blob b5"></div>
    <div class="blob b6"></div>
    <div class="blob b7"></div>
    <div class="blob b8"></div>
    <div class="vignette"></div>
  </div>

  <svg class="cap" width="220" height="140" viewBox="0 0 220 140">
    <polygon points="110,10 210,52 110,94 10,52" fill="#0d1b2a" />
    <rect x="92" y="52" width="36" height="60" rx="8" fill="#0d1b2a" />
    <circle cx="188" cy="58" r="8" fill="#fde68a" />
    <line x1="188" y1="58" x2="188" y2="110" stroke="#fde68a" stroke-width="5" stroke-linecap="round" />
    <circle cx="188" cy="116" r="10" fill="#fde68a" />
  </svg>

  <div class="ringfill"></div>
  <div class="glass">
    <div class="shine"></div>
    <div class="mono"><span class="i">I</span><span class="b">B</span></div>
  </div>
</div>
</body>
</html>
